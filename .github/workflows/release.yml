name: Build release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector:
    name: Build Rust connector
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Checkout connector reference
        uses: actions/checkout@v4
        with:
          repository: Qomicex-Public/qomicex-connector-rust
          ref: c43421925a6711baf4dcef36d234abe31bed2a43
          path: qomicex

      - name: Apply packet-free no-TUN patch
        shell: pwsh
        run: git -C qomicex apply --ignore-whitespace "${{ github.workspace }}\native\qomicex-no-packet.patch"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc and 7zip
        shell: pwsh
        run: |
          choco install protoc 7zip --no-progress -y
          $protoc = (Get-Command protoc).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare connector environment
        shell: pwsh
        working-directory: qomicex
        run: |
          @"
          [net]
          git-fetch-with-cli = true
          "@ | Set-Content .cargo/config.toml -Encoding ascii

      - name: Build connector CLI
        working-directory: qomicex
        run: cargo build -p qomicex-connector-cli --release

      - name: Upload connector binary
        uses: actions/upload-artifact@v4
        with:
          name: qomicex-connector
          path: qomicex/target/release/qomicex-connector-cli.exe
          if-no-files-found: error
          retention-days: 7

  build:
    name: Windows portable build
    needs: connector
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download connector binary
        uses: actions/download-artifact@v4
        with:
          name: qomicex-connector
          path: resources/bin

      - name: Install Rust for core sidecar
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core sidecar
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: npm run build:core:release

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build portable app
        run: npm run package

      - name: Build installer
        run: node scripts/build-installer.cjs

      - name: Create release archives and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portable = "release/Fangjie-Portable-$version.zip"
          $installer = "release/Fangjie-Launcher-$version-Setup.exe"
          Compress-Archive -Path "release/Fangjie-win32-x64/*" -DestinationPath $portable -CompressionLevel Optimal
          @($portable, $installer) | ForEach-Object {
            Get-FileHash $_ -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          } | Set-Content "release/SHA256SUMS.txt"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fangjie-Portable-${{ github.ref_name }}
          path: |
            release/Fangjie-Portable-*.zip
            release/Fangjie-Launcher-*-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
