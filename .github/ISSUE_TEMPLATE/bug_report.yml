name: Bug report
description: 报告可复现的启动器问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是最新预览版，并移除日志中的账号、令牌、服务器地址和个人路径。
        安全漏洞请不要公开提交，按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 启动器版本
      description: 例如 0.0.2-beta
      placeholder: 0.0.2-beta
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: 加载器
      options:
        - 原版
        - Fabric
        - Quilt
        - Forge
        - NeoForge
        - 与加载器无关
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft 版本
      placeholder: 1.21.4
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 可粘贴已脱敏的日志或拖入截图。请勿包含访问令牌、密码或完整 config.json。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已确认日志中不包含令牌、密码或其他敏感信息
          required: true
