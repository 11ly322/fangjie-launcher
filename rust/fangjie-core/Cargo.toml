[package]
name = "fangjie-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fangjie launcher core: crash diagnosis, mod scanning, repair planning and Tauri commands"

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
toml = "0.8"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
semver = "1"
tauri = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
